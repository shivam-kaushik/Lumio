name: lumio
description: "Lumio - The Context-Aware Reminder Assistant. Turning goals into actions."
publish_to: 'none'
version: 1.0.2+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  
  # Modern UI Components
  modal_bottom_sheet: ^3.0.0
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  lottie: ^3.1.2
  glassmorphism: ^3.0.0
  flutter_neumorphic: ^3.2.0
  go_router: ^14.2.0
  animations: ^2.0.11
  flutter_slidable: ^3.1.1
  
  # State Management
  provider: ^6.1.1
  flutter_bloc: ^8.1.3
  
  # Local Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  
  # Context Detection
  geolocator: ^10.1.0
  geofence_service: ^6.0.0+1
  connectivity_plus: ^5.0.2
  permission_handler: ^11.1.0
  google_maps_flutter: ^2.5.0
  
  # Background Tasks
  workmanager: ^0.6.0
  
  # Notifications
  # Use the latest available compatible version
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  
  # Firebase (for future cloud sync)
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  google_sign_in: ^6.2.1
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  collection: ^1.18.0
  cached_network_image: ^3.3.1
  
  # Speech & NLU
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  audioplayers: ^6.0.0
  web_socket_channel: ^2.4.0
  http: ^1.2.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.4.4
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1
  # device_preview: ^0.8.0  # Uncomment if you want to use DevicePreview for UI testing

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/Lumio_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#FF6B35" # App theme primary color (Orange)
  adaptive_icon_foreground: "assets/icons/Lumio_logo.png"
  remove_alpha_ios: true
