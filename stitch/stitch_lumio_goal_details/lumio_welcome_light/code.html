<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lumio Welcome Light</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ee992b",
                        "background-light": "#f8f7f6",
                        "background-dark": "#221a10",
                        "surface": "#ffffff",
                        "surface-dark": "#2d2418",
                        "text-main": "#1b150d",
                        "text-muted": "#6b5e4f",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                    backgroundImage: {
                        'warm-gradient': 'linear-gradient(180deg, #fcfaf8 0%, #f4efe9 100%)',
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-text-main font-display antialiased selection:bg-primary/30">
<div class="relative flex min-h-screen w-full flex-col bg-warm-gradient overflow-hidden mx-auto max-w-md shadow-2xl">
<!-- Status Bar Area Spacer (Simulated) -->
<div class="h-12 w-full"></div>
<!-- Content Container -->
<div class="flex flex-1 flex-col px-6 pb-8 pt-4">
<!-- Pagination Indicators -->
<div class="flex w-full flex-row items-center justify-center gap-2 py-6">
<div class="h-2 w-8 rounded-full bg-primary transition-all duration-300"></div>
<div class="h-2 w-2 rounded-full bg-primary/20"></div>
<div class="h-2 w-2 rounded-full bg-primary/20"></div>
</div>
<!-- Hero Image / Illustration Area -->
<div class="relative mb-8 flex flex-1 items-center justify-center rounded-2xl bg-white/40 p-8 shadow-sm border border-white/50 backdrop-blur-sm">
<!-- Abstract Design Element -->
<div class="relative flex h-48 w-48 items-center justify-center rounded-full bg-gradient-to-tr from-primary/10 to-primary/5 before:absolute before:inset-0 before:animate-pulse before:rounded-full before:bg-primary/5 before:blur-xl">
<span class="material-symbols-outlined text-[64px] text-primary drop-shadow-sm">
                        lightbulb
                    </span>
<!-- Decorative rings -->
<div class="absolute inset-0 rounded-full border border-primary/20 scale-125"></div>
<div class="absolute inset-0 rounded-full border border-primary/10 scale-150"></div>
</div>
</div>
<!-- Header Section -->
<div class="mb-8 text-center">
<h1 class="text-text-main tracking-tight text-[36px] font-extrabold leading-[1.1] mb-4">
                    Turn Ambition <br/>
<span class="text-primary">Into Action</span>
</h1>
<p class="text-text-muted text-[17px] font-normal leading-relaxed px-2">
                    Lumio is your AI-powered goal engine, designed to help solopreneurs focus, plan, and achieve more.
                </p>
</div>
<!-- Persona Selection Grid -->
<div class="mb-8">
<p class="text-center text-xs font-semibold uppercase tracking-widest text-text-muted/70 mb-4">I identify as a</p>
<div class="grid grid-cols-3 gap-3">
<!-- Card 1: Founder -->
<button class="group flex flex-col items-center gap-3 rounded-2xl border-2 border-transparent bg-white p-4 shadow-sm transition-all hover:border-primary/50 hover:shadow-md active:scale-95 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-[#fcfaf8]">
<div class="flex h-12 w-12 items-center justify-center rounded-full bg-primary/10 text-primary group-hover:bg-primary group-hover:text-white transition-colors">
<span class="material-symbols-outlined text-[24px]">business_center</span>
</div>
<h2 class="text-text-main text-sm font-bold">Founder</h2>
</button>
<!-- Card 2: Freelancer -->
<button class="group flex flex-col items-center gap-3 rounded-2xl border-2 border-primary bg-white p-4 shadow-md ring-1 ring-primary/20 relative overflow-hidden active:scale-95">
<div class="absolute top-2 right-2 h-2 w-2 rounded-full bg-primary"></div>
<div class="flex h-12 w-12 items-center justify-center rounded-full bg-primary text-white">
<span class="material-symbols-outlined text-[24px]">edit_note</span>
</div>
<h2 class="text-text-main text-sm font-bold">Freelancer</h2>
</button>
<!-- Card 3: Creator -->
<button class="group flex flex-col items-center gap-3 rounded-2xl border-2 border-transparent bg-white p-4 shadow-sm transition-all hover:border-primary/50 hover:shadow-md active:scale-95 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-[#fcfaf8]">
<div class="flex h-12 w-12 items-center justify-center rounded-full bg-primary/10 text-primary group-hover:bg-primary group-hover:text-white transition-colors">
<span class="material-symbols-outlined text-[24px]">videocam</span>
</div>
<h2 class="text-text-main text-sm font-bold">Creator</h2>
</button>
</div>
</div>
<!-- Footer / CTA -->
<div class="mt-auto flex flex-col gap-4">
<button class="relative flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-full bg-primary py-4 text-text-main shadow-lg shadow-primary/20 transition-transform active:scale-[0.98] group">
<span class="z-10 text-[17px] font-bold tracking-wide">Get Started</span>
<span class="material-symbols-outlined z-10 ml-2 text-[20px] transition-transform group-hover:translate-x-1">arrow_forward</span>
<!-- Button sheen effect -->
<div class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/20 to-transparent group-hover:animate-[shimmer_1.5s_infinite]"></div>
</button>
<p class="text-center text-sm font-medium text-text-muted">
                    Already have an account? <a class="text-primary hover:underline" href="#">Log in</a>
</p>
</div>
</div>
<!-- Home Indicator Spacer -->
<div class="h-6 w-full"></div>
</div>
</body></html>
