<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ed9521",
                        "background-light": "#f8f7f6",
                        "background-dark": "#221a10",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>Lumio - Edit Action</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<!-- Background Content Mirroring the Main App -->
<div class="p-6 opacity-40 pointer-events-none">
<header class="flex justify-between items-center mb-8">
<div>
<h1 class="text-2xl font-bold">Today's Focus</h1>
<p class="text-slate-500 dark:text-primary/60">Monday, Oct 24</p>
</div>
<div class="w-12 h-12 rounded-full bg-primary/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary">person</span>
</div>
</header>
<div class="space-y-4">
<div class="p-4 bg-primary/10 rounded-xl border border-primary/20 flex items-center gap-4">
<div class="w-6 h-6 rounded border-2 border-primary"></div>
<div class="flex-1">
<div class="h-4 w-3/4 bg-slate-700 rounded mb-2"></div>
<div class="h-3 w-1/4 bg-slate-800 rounded"></div>
</div>
</div>
<div class="p-4 bg-slate-800/50 rounded-xl border border-slate-700/50 flex items-center gap-4">
<div class="w-6 h-6 rounded border-2 border-slate-600"></div>
<div class="flex-1">
<div class="h-4 w-1/2 bg-slate-700 rounded mb-2"></div>
<div class="h-3 w-1/3 bg-slate-800 rounded"></div>
</div>
</div>
</div>
</div>
<!-- Bottom Sheet Overlay -->
<div class="fixed inset-0 z-50 flex flex-col justify-end bg-black/60 backdrop-blur-sm">
<!-- Bottom Sheet Content -->
<div class="bg-background-dark border-t border-primary/10 rounded-t-lg shadow-2xl animate-slide-up">
<!-- BottomSheetHandle -->
<button class="flex h-6 w-full items-center justify-center pt-2">
<div class="h-1.5 w-12 rounded-full bg-slate-700 dark:bg-primary/20"></div>
</button>
<div class="px-6 pt-4 pb-10 max-w-2xl mx-auto">
<div class="flex justify-between items-center mb-6">
<h2 class="text-2xl font-bold text-slate-100 tracking-tight">Edit Action</h2>
<button class="text-primary font-semibold text-sm px-4 py-2 bg-primary/10 rounded-full">Save Changes</button>
</div>
<div class="space-y-6">
<!-- Name Input -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-primary/80 ml-1">Action Name</label>
<div class="relative">
<input class="w-full bg-slate-800/50 border-none rounded-xl h-14 px-4 text-slate-100 placeholder:text-slate-500 focus:ring-2 focus:ring-primary/40 transition-all" placeholder="What needs to be done?" type="text" value="Design system review"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-500">edit_note</span>
</div>
</div>
<!-- Deadline & Time Grid -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-primary/80 ml-1">Deadline</label>
<div class="relative">
<input class="w-full bg-slate-800/50 border-none rounded-xl h-14 px-4 text-slate-100 focus:ring-2 focus:ring-primary/40 transition-all" type="text" value="Oct 26, 2023"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 text-xl">calendar_today</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-primary/80 ml-1">Time</label>
<div class="relative">
<input class="w-full bg-slate-800/50 border-none rounded-xl h-14 px-4 text-slate-100 focus:ring-2 focus:ring-primary/40 transition-all" type="text" value="02:30 PM"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 text-xl">schedule</span>
</div>
</div>
</div>
<!-- Priority Selection -->
<div class="flex flex-col gap-3">
<label class="text-sm font-medium text-primary/80 ml-1">Priority</label>
<div class="flex gap-3">
<button class="flex-1 py-3 px-4 rounded-xl border border-slate-700 bg-slate-800/30 text-slate-400 font-medium flex items-center justify-center gap-2 hover:bg-slate-800 transition-colors">
<span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                                Low
                            </button>
<button class="flex-1 py-3 px-4 rounded-xl border border-primary/40 bg-primary/10 text-primary font-bold flex items-center justify-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary"></span>
                                Medium
                            </button>
<button class="flex-1 py-3 px-4 rounded-xl border border-slate-700 bg-slate-800/30 text-slate-400 font-medium flex items-center justify-center gap-2 hover:bg-slate-800 transition-colors">
<span class="w-2 h-2 rounded-full bg-rose-500"></span>
                                High
                            </button>
</div>
</div>
<!-- Additional Options -->
<div class="pt-2">
<button class="w-full flex items-center justify-between p-4 rounded-xl bg-slate-800/30 border border-slate-700/50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-400">notifications</span>
<span class="text-slate-200">Set Reminder</span>
</div>
<div class="w-10 h-6 bg-primary rounded-full relative">
<div class="absolute right-1 top-1 w-4 h-4 bg-white rounded-full"></div>
</div>
</button>
</div>
<!-- Delete Action -->
<div class="pt-4">
<button class="w-full flex items-center justify-center gap-2 text-rose-500 font-medium py-2">
<span class="material-symbols-outlined text-xl">delete</span>
                            Delete Action
                        </button>
</div>
</div>
</div>
</div>
</div>
</body></html>
