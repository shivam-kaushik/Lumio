<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f83600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fe8c00;stop-opacity:1" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="30" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#grad)" />
  <circle cx="400" cy="300" r="150" fill="#ffffff" fill-opacity="0.1" filter="url(#blur)" />
  <circle cx="200" cy="500" r="100" fill="#ff9a9e" fill-opacity="0.2" />
  <circle cx="600" cy="100" r="80" fill="#fad0c4" fill-opacity="0.2" />
</svg>
